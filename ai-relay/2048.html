<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f7f6">
<title>2048 · 数字方块</title>
<style>
:root{color-scheme:light;--ink:#1e2928;--muted:#71807c;--line:#dce4e1;--paper:#f4f7f6;--white:#fff;--board:#d8e1de;--accent:#187965;--accent-dark:#105d4d;--coral:#e46d50;--shadow:0 18px 45px #20332b12}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding:22px clamp(14px,4vw,36px) 28px}
button{font:inherit;color:inherit;cursor:pointer}
.app{width:min(100%,900px);margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 0 20px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:42px;height:42px;display:grid;place-items:center;flex:none;border-radius:9px;background:#187965;color:white;font-weight:850;font-size:17px;box-shadow:0 5px 12px #18796530}
.brand h1{margin:0;font-size:18px;line-height:1.15;font-weight:780}
.brand p{margin:5px 0 0;color:var(--muted);font-size:11px}
.top-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:7px;background:var(--white);color:#53625e;font-size:21px;line-height:1;transition:background .15s,border-color .15s,transform .15s}
.icon-btn:hover:not(:disabled){background:#edf4f1;border-color:#b8cbc4;transform:translateY(-1px)}
.icon-btn:disabled{opacity:.4;cursor:not-allowed}
.game-layout{display:grid;grid-template-columns:minmax(0,1fr) 226px;gap:28px;align-items:start;padding-top:26px}
.board-column{min-width:0}
.board-head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:12px}
.board-head h2{margin:0;font-size:14px;font-weight:690}
.board-head p{margin:0;color:var(--muted);font-size:11px}
.board-wrap{position:relative;width:100%;max-width:520px;margin:0 auto;aspect-ratio:1;padding:11px;border-radius:9px;background:var(--board);box-shadow:var(--shadow);touch-action:none;user-select:none}
.board{height:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:11px}
.cell{min-width:0;min-height:0;display:grid;place-items:center;border-radius:6px;background:#c8d3cf;font-size:clamp(20px,5vw,40px);font-weight:800;font-variant-numeric:tabular-nums;color:#52615c;line-height:1}
.cell.tile{animation:appear .14s ease-out both}
.cell.merge{animation:merge .18s ease-out both}
.cell[data-value="2"]{background:#f8fbf9;color:#596b65}
.cell[data-value="4"]{background:#e5f2ec;color:#41675b}
.cell[data-value="8"]{background:#9ed9c4;color:#164f40}
.cell[data-value="16"]{background:#5dbb9d;color:#fff}
.cell[data-value="32"]{background:#57b8c1;color:#fff}
.cell[data-value="64"]{background:#478fa5;color:#fff}
.cell[data-value="128"]{background:#ecc66a;color:#443616;font-size:clamp(18px,4.2vw,33px)}
.cell[data-value="256"]{background:#e99b54;color:#fff;font-size:clamp(18px,4.2vw,33px)}
.cell[data-value="512"]{background:#e77959;color:#fff;font-size:clamp(18px,4.2vw,33px)}
.cell[data-value="1024"]{background:#c95758;color:#fff;font-size:clamp(15px,3.5vw,27px)}
.cell[data-value="2048"]{background:#203a39;color:#fff0a8;font-size:clamp(15px,3.5vw,27px);box-shadow:inset 0 0 0 2px #f2cf73}
.cell[data-value="over"]{background:#354447;color:#fff;font-size:clamp(14px,3.2vw,25px)}
.overlay{position:absolute;inset:0;z-index:2;display:none;place-items:center;padding:18px;border-radius:9px;background:#f4f7f6df;backdrop-filter:blur(3px);text-align:center}
.overlay.show{display:grid}
.overlay-box{width:min(100%,320px);padding:22px 20px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 14px 40px #23352c20}
.overlay-box h3{margin:0;font-size:25px;line-height:1.2}
.overlay-box p{margin:8px 0 17px;color:var(--muted);font-size:12px}
.primary{min-height:41px;padding:0 16px;border:1px solid var(--accent);border-radius:6px;background:var(--accent);color:white;font-size:13px;font-weight:700;transition:background .15s}
.primary:hover{background:var(--accent-dark)}
.side{padding-top:2px}
.score-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.score-box{min-width:0;padding:13px 12px;border:1px solid var(--line);border-radius:7px;background:#fff}
.score-label{display:block;color:var(--muted);font-size:10px;font-weight:650}
.score-value{display:block;margin-top:6px;font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05;overflow:hidden;text-overflow:ellipsis}
.side-actions{display:grid;gap:8px;margin-top:13px}
.action{min-height:42px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:6px;background:white;font-size:12px;font-weight:680;transition:background .15s,border-color .15s}
.action:hover{background:#eef5f1;border-color:#b8cbc4}
.action span:first-child{font-size:16px}
.action.new{border-color:#cadbd5;background:#e9f2ee;color:#185e4c}
.action.new:hover{background:#dcebe5}
.side-rule{height:1px;margin:18px 0 15px;background:var(--line)}
.side-label{margin:0 0 10px;color:#657570;font-size:10px;font-weight:750}
.pad{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,42px);gap:5px;justify-content:center}
.pad button{display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;background:#fff;color:#53635e;font-size:19px;transition:background .12s,border-color .12s}
.pad button:hover{background:#e9f2ee;border-color:#b8cbc4}
.pad .up{grid-column:2;grid-row:1}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
.footnote{margin:17px 0 0;color:#889590;font-size:10px;text-align:center}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@keyframes appear{from{transform:scale(.72);opacity:.35}to{transform:scale(1);opacity:1}}
@keyframes merge{from{transform:scale(.88)}to{transform:scale(1)}}
@media(max-width:680px){body{padding:13px 13px calc(16px + env(safe-area-inset-bottom))}.topbar{padding-bottom:13px}.brand-mark{width:37px;height:37px}.brand h1{font-size:16px}.icon-btn{width:37px;height:37px}.game-layout{grid-template-columns:minmax(0,1fr);gap:14px;padding-top:17px}.board-head{margin-bottom:9px}.board-wrap{max-width:min(100%,480px);padding:9px}.board{gap:8px}.side{width:min(100%,480px);margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;align-items:center}.score-row{grid-column:1;grid-row:1}.side-actions{grid-column:1;grid-row:2;margin-top:0;display:grid;grid-template-columns:1fr 1fr}.side-rule,.side-label{display:none}.pad{grid-column:2;grid-row:1 / span 2;grid-template-columns:repeat(3,38px);grid-template-rows:repeat(2,38px)}.footnote{grid-column:1/-1;margin:0;text-align:left}}
@media(max-width:360px){.cell{font-size:20px}.cell[data-value="128"],.cell[data-value="256"],.cell[data-value="512"]{font-size:17px}.cell[data-value="1024"],.cell[data-value="2048"],.cell[data-value="over"]{font-size:14px}.board-wrap{padding:7px}.board{gap:6px}.side{gap:8px}.score-box{padding:10px}.score-value{font-size:20px}.pad{grid-template-columns:repeat(3,34px);grid-template-rows:repeat(2,36px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark" aria-hidden="true">2048</div><div><h1>数字方块</h1><p>合并每一次灵感</p></div></div>
    <div class="top-actions"><button class="icon-btn" id="undoTop" type="button" aria-label="撤销上一步" title="撤销上一步" disabled>↶</button></div>
  </header>
  <section class="game-layout" aria-label="2048 游戏">
    <div class="board-column">
      <div class="board-head"><h2>2048</h2><p>最高目标 · 2048</p></div>
      <div class="board-wrap" id="boardWrap">
        <div class="board" id="board" role="grid" aria-label="数字方块棋盘"></div>
        <div class="overlay" id="winOverlay" role="dialog" aria-modal="true" aria-labelledby="winTitle">
          <div class="overlay-box"><h3 id="winTitle">达成 2048</h3><p>漂亮的一局，继续冲分吧。</p><button class="primary" id="continueBtn" type="button">继续游戏</button></div>
        </div>
        <div class="overlay" id="overOverlay" role="dialog" aria-modal="true" aria-labelledby="overTitle">
          <div class="overlay-box"><h3 id="overTitle">棋盘已满</h3><p>本局得分 <strong id="finalScore">0</strong></p><button class="primary" id="overNewBtn" type="button">再来一局</button></div>
        </div>
      </div>
      <div class="sr-only" id="liveRegion" aria-live="polite" aria-atomic="true"></div>
    </div>
    <aside class="side" aria-label="游戏控制">
      <div class="score-row">
        <div class="score-box"><span class="score-label">本局分数</span><strong class="score-value" id="score">0</strong></div>
        <div class="score-box"><span class="score-label">最高分</span><strong class="score-value" id="best">0</strong></div>
      </div>
      <div class="side-actions">
        <button class="action" id="undoBtn" type="button" aria-label="撤销上一步" title="撤销上一步" disabled><span aria-hidden="true">↶</span><span>撤销</span></button>
        <button class="action new" id="newBtn" type="button"><span aria-hidden="true">＋</span><span>新游戏</span></button>
      </div>
      <div class="side-rule" aria-hidden="true"></div>
      <div class="pad" aria-label="方向控制">
        <button class="up" type="button" data-direction="up" aria-label="向上" title="向上">↑</button>
        <button class="left" type="button" data-direction="left" aria-label="向左" title="向左">←</button>
        <button class="down" type="button" data-direction="down" aria-label="向下" title="向下">↓</button>
        <button class="right" type="button" data-direction="right" aria-label="向右" title="向右">→</button>
      </div>
    </aside>
  </section>
</main>
<script>
(() => {
  'use strict';

  const STORAGE_KEY = 'ai-relay-2048-state';
  const $ = (id) => document.getElementById(id);
  const boardEl = $('board');
  const cells = [];
  let board = emptyBoard();
  let score = 0;
  let best = 0;
  let won = false;
  let continued = false;
  let undoState = null;
  let touchStart = null;

  function emptyBoard() { return Array.from({length: 4}, () => Array(4).fill(0)); }
  function cloneBoard(value) { return value.map(row => row.slice()); }
  function validBoard(value) {
    if (!Array.isArray(value) || value.length !== 4 || !value.every(row => Array.isArray(row) && row.length === 4)) return false;
    return value.some(row => row.some(Boolean)) && value.every(row => row.every(tile =>
      Number.isInteger(tile) && tile >= 0 && (tile === 0 || (tile & (tile - 1)) === 0)));
  }
  function loadState() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (!saved || !validBoard(saved.board)) return false;
      board = cloneBoard(saved.board);
      score = Number.isFinite(saved.score) ? Math.max(0, saved.score) : 0;
      best = Math.max(score, Number.isFinite(saved.best) ? Math.max(0, saved.best) : 0);
      won = Boolean(saved.won) || Math.max(...board.flat()) >= 2048;
      continued = Boolean(saved.continued);
      if (!saved.won && won) continued = false;
      return true;
    } catch (_) { return false; }
  }
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({board, score, best, won, continued})); }
    catch (_) { /* Storage may be disabled; the current session remains playable. */ }
  }
  function addRandomTile() {
    const empty = [];
    board.forEach((row, r) => row.forEach((value, c) => { if (!value) empty.push([r, c]); }));
    if (!empty.length) return -1;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    board[r][c] = Math.random() < 0.9 ? 2 : 4;
    return r * 4 + c;
  }
  function hasMoves() {
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
      if (!board[r][c]) return true;
      if (c < 3 && board[r][c] === board[r][c + 1]) return true;
      if (r < 3 && board[r][c] === board[r + 1][c]) return true;
    }
    return false;
  }
  function render(merged = new Set(), spawned = -1) {
    board.forEach((row, r) => row.forEach((value, c) => {
      const index = r * 4 + c;
      const cell = cells[index];
      cell.textContent = value ? String(value) : '';
      cell.className = 'cell';
      cell.removeAttribute('data-value');
      if (value) {
        cell.dataset.value = value <= 2048 ? value : 'over';
        if (merged.has(index)) cell.classList.add('merge');
        cell.setAttribute('aria-label', String(value));
      } else {
        cell.setAttribute('aria-label', '空');
      }
      cell.setAttribute('aria-rowindex', String(r + 1));
      cell.setAttribute('aria-colindex', String(c + 1));
      if (index === spawned && value) cell.classList.add('tile');
    }));
    $('score').textContent = String(score);
    $('best').textContent = String(best);
    $('undoBtn').disabled = !undoState;
    $('undoTop').disabled = !undoState;
    $('finalScore').textContent = String(score);
    $('winOverlay').classList.toggle('show', won && !continued);
    $('overOverlay').classList.toggle('show', !hasMoves() && !(won && !continued));
    $('liveRegion').textContent = `分数 ${score}，最高分 ${best}`;
  }
  function startNewGame() {
    board = emptyBoard();
    score = 0;
    won = false;
    continued = false;
    undoState = null;
    addRandomTile();
    addRandomTile();
    saveState();
    render();
  }
  function lineCoordinates(direction, index) {
    if (direction === 'left') return Array.from({length: 4}, (_, n) => [index, n]);
    if (direction === 'right') return Array.from({length: 4}, (_, n) => [index, 3 - n]);
    if (direction === 'up') return Array.from({length: 4}, (_, n) => [n, index]);
    return Array.from({length: 4}, (_, n) => [3 - n, index]);
  }
  function move(direction) {
    if ((won && !continued) || !hasMoves()) return;
    const before = cloneBoard(board);
    const previousScore = score;
    const merged = new Set();
    for (let i = 0; i < 4; i++) {
      const coords = lineCoordinates(direction, i);
      const values = coords.map(([r, c]) => board[r][c]).filter(Boolean);
      const next = [];
      for (let n = 0; n < values.length; n++) {
        if (values[n] === values[n + 1]) {
          const value = values[n] * 2;
          next.push(value);
          score += value;
          n++;
          const [r, c] = coords[next.length - 1];
          merged.add(r * 4 + c);
        } else next.push(values[n]);
      }
      while (next.length < 4) next.push(0);
      coords.forEach(([r, c], n) => { board[r][c] = next[n]; });
    }
    if (board.every((row, r) => row.every((value, c) => value === before[r][c]))) return;
    undoState = {board: before, score: previousScore, won, continued};
    const spawned = addRandomTile();
    const largest = Math.max(...board.flat());
    if (largest >= 2048 && !won) { won = true; continued = false; }
    if (score > best) best = score;
    saveState();
    render(merged, spawned);
  }
  function undo() {
    if (!undoState) return;
    board = cloneBoard(undoState.board);
    score = undoState.score;
    won = undoState.won;
    continued = undoState.continued;
    undoState = null;
    saveState();
    render();
  }

  for (let i = 0; i < 16; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.setAttribute('role', 'gridcell');
    cells.push(cell);
    boardEl.appendChild(cell);
  }
  if (!loadState()) startNewGame();
  render();

  window.addEventListener('keydown', event => {
    const directions = {ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', KeyW: 'up', KeyS: 'down', KeyA: 'left', KeyD: 'right'};
    const direction = directions[event.code];
    if (direction) { event.preventDefault(); move(direction); }
  });
  document.querySelectorAll('[data-direction]').forEach(button => button.addEventListener('click', () => move(button.dataset.direction)));
  $('newBtn').addEventListener('click', startNewGame);
  $('overNewBtn').addEventListener('click', startNewGame);
  $('undoBtn').addEventListener('click', undo);
  $('undoTop').addEventListener('click', undo);
  $('continueBtn').addEventListener('click', () => { continued = true; saveState(); render(); });
  $('boardWrap').addEventListener('pointerdown', event => {
    touchStart = {x: event.clientX, y: event.clientY};
  });
  $('boardWrap').addEventListener('pointerup', event => {
    if (!touchStart) return;
    const dx = event.clientX - touchStart.x;
    const dy = event.clientY - touchStart.y;
    touchStart = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  });
  $('boardWrap').addEventListener('pointercancel', () => { touchStart = null; });
})();
</script>
</body>
</html>
